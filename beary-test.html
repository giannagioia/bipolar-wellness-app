[hidden]{display:none!important}
</style></head><body><div id="app"></div>
<script>
// ===== Data layer (prototype only: localStorage. Replace with a secure backend; not production health-data storage) =====
// Two test links share this file: ?mode=fresh (first-time user, starts with onboarding) and ?mode=alex (pre-filled fictional person).
const MODE=(()=>{try{return new URLSearchParams(location.search).get('mode')==='alex'?'alex':'fresh'}catch(e){return'fresh'}})();
const KEY='beary-'+MODE+'-v1',$=s=>document.querySelector(s);
const iso=d=>d.toISOString().slice(0,10),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const MOODS=[['good','Good','#9fcf9f'],['okay','Okay','#b6a5cf'],['low','Low','#9fb4d3'],['irr','Irritable','#d3a0a0']];
const MN=Object.fromEntries(MOODS.map(m=>[m[0],m[1]]));
function seed(){const checks={},sleep={};
 // 14 days, oldest first. Each day: entries [time, mood, energy, note], meds, sleep hours. Fictional person, not real data.
 const D=[
 [[['09:00','okay','steady','Slept okay. Class went fine.']],'taken',7.5],
 [[['21:30','low','low','Tired after work. Kept thinking about the exam.']],'taken',6],
 [[['10:00','okay','steady',''],['18:30','good','high','Went for a walk with a friend and felt lighter.']],'taken',7],
 [[['08:30','low','low','Barely slept, woke up twice.'],['20:00','okay','steady','']],'taken',5],
 [[['15:00','irr','high','Snapped at my roommate over nothing. Is this stress or my mood?'],['22:00','low','low','Felt bad about it later.']],'skipped',5.5],
 [[['11:00','okay','steady','']],'taken',7],
 [[['12:00','okay','steady','']],'taken',7],
 [[['09:00','low','low','Overwhelmed with school and work.']],'taken',6],
 [[['13:00','good','steady','Good day. Got things done.']],'',7.5],
 [[['09:30','okay','steady','']],'taken',7],
 [[['08:00','low','low','Did not sleep much again. Should I mention this to Dr. Rivera?']],'skipped',5],
 [[['16:00','irr','steady','Busy day, felt on edge.'],['21:00','okay','steady','']],'taken',6],
 [[['12:00','okay','steady','']],'taken',7],
 [[],'',0]];
 D.forEach((x,i)=>{const d=iso(ago(13-i));checks[d]={entries:x[0].map(e=>({t:e[0],mood:e[1],energy:e[2]||undefined,note:e[3],sample:1})),meds:x[1]||undefined,msample:x[1]?1:undefined};if(!x[1])delete checks[d].msample;if(!x[0].length&&!x[1])delete checks[d];if(x[2])sleep[d]={h:x[2],q:'ok',sample:1}});
 const B=(t)=>({r:'b',t,proto:1}),U=(t)=>({r:'u',t});
 return{view:'home',v2:1,ms:{},checks,sleep,cur:0,
 conv:[
 {id:3,sample:1,t:ago(2).toISOString(),title:'Questions for Dr. Rivera',msgs:[U('What should I ask my provider?'),B('For your next visit, you could write down: What changes should I describe? Which mood, sleep, or energy patterns should I track? What questions do I have about care options? You can edit these and bring them to your clinician.'),U('I have not been sleeping well. Should I bring that up?'),B('Thanks for telling me. A big change like that is worth sharing with your care team. I can help you put it into a summary for them.')]},
 {id:2,sample:1,t:ago(5).toISOString(),title:'Feeling overwhelmed',msgs:[U('I feel overwhelmed with school and work lately.'),B('That sounds like a lot to carry. What has felt heaviest this week?'),U('Deadlines, mostly. I get stressed and then my energy drops.')]},
 {id:1,sample:1,t:ago(9).toISOString(),title:'Stress or mood?',msgs:[U('Is it stress or is my mood changing? I can\'t tell them apart.'),B('That is a hard thing to sort out alone. I can\'t tell you which it is, but a clinician can look at it with you. Want to note it as a question for your appointment?')]}],
 appts:[{id:1,sample:1,who:'Dr. Rivera (sample)',kind:'Therapy session',date:iso(ago(-4)),time:'15:30'}],sums:[],preps:{}}}
const blank=()=>({view:'home',v2:1,ms:{},checks:{},sleep:{},cur:0,conv:[{id:Date.now(),t:new Date().toISOString(),title:'New conversation',msgs:[introMsg()]}],appts:[],sums:[],preps:{}});
// Test version: nothing is saved. Every page load starts from the beginning (walkthrough or Alex intro). Old saved data is cleared.
try{localStorage.removeItem(KEY)}catch(e){}
let S=MODE=='alex'?seed():blank();Object.values(S.checks).forEach(c=>{if(!c.entries){c.entries=c.mood?[{t:'12:00',mood:c.mood,note:c.note||''}]:[];delete c.mood;delete c.note}});
if(!S.v2){const sd=seed();for(const d in sd.checks){const c=S.checks[d],e=c&&c.entries,x=sd.checks[d].entries[0];if(c&&e.length==1&&e[0].mood==x.mood&&e[0].t=='12:00'&&(e[0].note||'')==x.note){e[0].sample=1;c.msample=1}}
 for(const d in sd.sleep){const z=S.sleep[d];if(z&&z.h==sd.sleep[d].h&&z.q=='ok')z.sample=1}
 S.appts.forEach(a=>{if(a.id===1)a.sample=1});S.conv.forEach(c=>{if(c.id===1)c.sample=1});const m=S.ms={};const t=new Date().toISOString().slice(0,10);
 if(Object.values(S.checks).some(c=>c.entries.some(e=>!e.sample)))m.checkin=t;if(S.conv.some(c=>!c.sample&&c.msgs.some(x=>x.r=='u')))m.chat=t;if(Object.values(S.sleep).some(z=>!z.sample))m.sleep=t;
 if(S.sums.length)m.summary=t;if(S.appts.some(a=>!a.sample))m.appt=t;if(Object.keys(S.preps).length)m.prep=t;S.v2=1}
const save=()=>{};
let ui={stack:[],sum:{range:3,src:{chat:1,checks:1},ex:{}},draft:null,busy:false,err:null,modal:null,hist:false};
const closeHistory=()=>{ui.hist=false;render()};
const openChatInfo=()=>{ui.hist=false;ui.modal='chatInfo';render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.hist){closeHistory()}else if(e.key==='Escape'&&ui.modal==='chatInfo'){ui.modal=null;render()}});

// ===== Voiceflow adapter boundary =====
// Presentation never calls Voiceflow directly. To connect: deploy a small server proxy that holds your Voiceflow API key
// and calls POST https://general-runtime.voiceflow.com/state/user/{userID}/interact with your versionID;
// then set VOICEFLOW.proxyUrl to that proxy. Never put the API key in this file.
const VOICEFLOW={proxyUrl:null};
const CRISIS=/(suicid|kill myself|end my life|want to die|hurt myself|self.?harm|not safe)/i;
const ChatService={async send(text,history){
 if(VOICEFLOW.proxyUrl){const r=await fetch(VOICEFLOW.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});if(!r.ok)throw new Error('Service error');return{text:(await r.json()).text}}
 await new Promise(r=>setTimeout(r,900));if(/\/fail/.test(text))throw new Error('Simulated failure');
 if(CRISIS.test(text))return{crisis:true};
 if(/\b(am i bipolar|do i have bipolar|diagnose me|is this mania|am i manic|is this depression)\b/i.test(text))return{text:'I can explain terms and help you prepare for an evaluation, but I cannot determine whether you have bipolar disorder or identify a mood episode. A licensed clinician can review your experience and history with you. Would you like to write down questions for an appointment?',proto:1};
 if(/\b(hypomania|hypomanic)\b/i.test(text))return{text:'Hypomania is a period of elevated or unusually irritable mood and increased energy or activity that is less severe than mania. It is a clinical term, not something Beary can identify in an individual. Read more: https://medlineplus.gov/bipolardisorder.html',proto:1};
 if(/\b(mania|manic)\b/i.test(text))return{text:'Mania is a clinical term for a period of unusually elevated or irritable mood and increased activity or energy. A healthcare professional evaluates symptoms and their context. More information: https://www.nimh.nih.gov/health/publications/bipolar-disorder',proto:1};
 if(/\b(bipolar|bipolar disorder)\b/i.test(text))return{text:'Bipolar disorder is a mental health condition involving changes in mood, energy, activity, and thinking, including manic or hypomanic and depressive episodes. These terms describe patterns assessed by clinicians. Learn more: https://www.nimh.nih.gov/health/publications/bipolar-disorder',proto:1};
 if(/support group|support organization|where can i find support|find help|resources/i.test(text))return{text:'The Depression and Bipolar Support Alliance (DBSA) offers peer-support resources: https://www.dbsalliance.org/ . For mental health treatment providers in the U.S., use the government directory at https://findtreatment.gov/ . For immediate U.S. crisis support, call or text 988.',proto:1};

  ${es.length?es.map(e=>`<div class="tl"><span class="tm">${ftm(e.t)}</span><span>${MN[e.mood]}${e.energy?' · energy '+EN[e.energy].toLowerCase():''}${e.sample?' <span class="tag">sample</span>':''}${e.note?`<br><span class="mu">“${esc(e.note)}”</span>`:''}</span></div>`).join(''):'<div class="card miss"><p>No mood entries. Nothing was recorded for this day, and that\'s okay.</p></div>'}

 if(m=='sleep'){const d=ui.d||today(),z=S.sleep[d];h=`${guide('Sleep tells a lot about a week. Tell me roughly how many hours you got and how it felt.')}<h2>${z?'Edit sleep':'Log sleep'}</h2><label>Night of (the morning you woke up)</label>${strip(d,'pickSleepDay')}<label for="sh">Hours slept</label><input id="sh" type="number" step="0.5" min="0" max="16" placeholder="e.g. 7.5" value="${z?z.h:''}"><label for="sq">How did it feel?</label><select id="sq">${Object.entries(QN).map(([k,v])=>`<option value="${k}" ${(z?z.q:'ok')==k?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><p id="fe" style="color:var(--bad)"></p><button class="btn" onclick="saveSleep()">Save</button>${z?'<button class="btn ghost" style="margin-top:8px" onclick="delSleep()">Remove this entry</button>':''}`}
 if(m=='appt'){if(!ui.ap||ui.ap.id!=ui.edit){const a=S.appts.find(x=>x.id==ui.edit)||{who:'',kind:'Therapy session',date:today(),time:'10:00'};ui.ap={id:ui.edit,who:a.who,kind:a.kind,date:a.date,time:a.time}}const a=ui.ap;
  h=`${guide('Add a visit so we can get ready for it together. I will not book anything. This is just a note for you.')}<h2>${ui.edit?'Edit':'Add'} appointment</h2><p class="mu">This only saves a note here. It doesn't book anything.</p><label for="aw">Provider name</label><input id="aw" value="${esc(a.who)}"><label for="ak">Type</label><input id="ak" value="${esc(a.kind)}"><label>Date</label>${strip(a.date,'pickApDay',1)}<label>Time</label>${tpick('ap',a.time)}<p id="fe" style="color:var(--bad)"></p><button class="btn" onclick="saveAppt()">Save</button>${ui.edit?'<button class="btn ghost" style="margin-top:8px" onclick="delAppt()">Delete</button>':''}`}
  if(m=='chatInfo')h=`<div class="chat-info-sheet"><h2 id="about-beary">About Beary</h2>
  <p>Beary is a learning and reflection companion for people living with bipolar disorder, those exploring whether to seek an evaluation, and anyone who wants to understand the condition. It can help you explore information and prepare questions for a healthcare professional.</p>

  <h3>What Beary cannot do</h3>

  <h3>Approved educational references</h3>
  <p>These are the sources designated for Beary's intended educational content:</p>

 if(m=='share')h=`<h2>Before you copy</h2><p>This summary contains personal reflections. Copying doesn't send it anywhere. You decide who sees it.</p><div class="row"><button class="btn" onclick="copyIt()">Copy summary</button><button class="btn ghost" onclick="ui.modal=null;render()">Not now</button></div>`;

// ===== Actions =====
const err=m=>{const e=$('#fe');if(e)e.textContent=m};
function saveCheck(){syncF();const f=ui.f,ex=S.checks[f.d],cm=ex?ex.meds:undefined;if(!f.mood&&f.meds===cm)return err('Pick a mood, or change the medication log, to save.');if(f.mood&&!f.time)return err('Add a time for this entry.');const c=S.checks[f.d]||(S.checks[f.d]={entries:[]});if(f.mood){c.entries.push({t:f.time,mood:f.mood,energy:f.energy||undefined,note:(f.note||'').trim()});c.entries.sort((x,y)=>x.t.localeCompare(y.t));award('checkin')}if(f.meds!==undefined&&f.meds!==cm){c.meds=f.meds;delete c.msample}save();ui.modal=null;ui.f=null;ui.d=null;ui.ap=null;render();toast(f.mood?'Added. Moods can change, and that\'s okay.':'Saved')}

function delAppt(){S.appts=S.appts.filter(a=>a.id!=ui.edit);save();ui.modal=null;ui.ap=null;render();toast('Removed')}
function newChat(){S.conv.unshift({id:Date.now(),t:new Date().toISOString(),title:'New conversation',excl:false,msgs:[introMsg()]});S.cur=0;ui.hist=false;save();render()}
function talkToBeary(){const c=S.conv[S.cur];if(c&&c.msgs.some(m=>m.r=='u'))newChat();go('chat')}
async function sendMsg(t){t=(t||'').trim();if(!t||ui.busy)return;const c=S.conv[S.cur];c.msgs.push({r:'u',t});if(c.title=='New conversation')c.title=t.slice(0,32);ui.err=null;save();await reply(c)}

function ensureItems(d){(d.sec||[]).forEach(x=>{if(!x.items)x.items=(x.t||'').split('\n').map(z=>z.replace(/^- /,'').trim()).filter(Boolean).map(t=>({t,m:''}))});return d}
function genSum(){const u=ui.sum,cut=iso(ago(u.range-1)),end=today(),qt=[];
 const dts=[...Array(u.range)].map((_,i)=>iso(ago(u.range-1-i))),cs=u.src.chat?S.conv.filter(c=>c.t.slice(0,10)>=cut&&!u.ex[c.id]):[];
 cs.forEach(c=>c.msgs.filter(m=>m.r=='u').forEach(m=>qt.push({s:'Chat · '+fd(c.t),t:m.t})));

 if(!qt.length&&!rec.length){toast('Nothing recorded in that range yet. Try a longer period or other sources.');return}

 if(u.src.checks){const L=[];let none=0;dts.forEach(d=>{const es=(S.checks[d]||{}).entries||[];if(!es.length){none++;return}L.push({t:fd(d)+': '+es.map(e=>`${MN[e.mood]} at ${ftm(e.t)}${e.energy?', '+EN[e.energy].toLowerCase()+' energy':''}`).join('; '),m:''})});
  const sd=dts.filter(d=>S.sleep[d]);if(sd.length){const h=sd.map(d=>S.sleep[d].h);L.push({t:`Sleep: ${sd.length} night${sd.length==1?'':'s'} recorded, ${Math.min(...h)} to ${Math.max(...h)} hours, average ${(h.reduce((a,b)=>a+b)/h.length).toFixed(1)}`,m:''})}
  if(dts.length-sd.length)L.push({t:`Sleep not recorded on ${dts.length-sd.length} night${dts.length-sd.length==1?'':'s'}`,m:''});const ml=dts.map(d=>(S.checks[d]||{}).meds);L.push({t:`Medication: taken on ${ml.filter(x=>x=='taken').length} day${ml.filter(x=>x=='taken').length==1?'':'s'}, not taken on ${ml.filter(x=>x=='skipped').length}, not logged on ${ml.filter(x=>!x).length}`,m:''});if(none)L.push({t:`No mood entries on ${none} day${none==1?'':'s'}`,m:''});

 const title=`Summary, ${fd(cut)} to ${fd(end)}`,range=u.range==1?'Today, '+fd(end):`Past ${u.range} days, ${fd(cut)} to ${fd(end)}`;ui.draft={title,range,src,sec};award('summary');go('sumview')}
function addPt(i){ui.draft.sec[i].items.push({t:'',m:''});render();try{const e=document.querySelectorAll('.sec')[i].querySelectorAll('.t');e[e.length-1].focus()}catch(x){}}
