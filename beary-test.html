<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Beary – wellness companion (prototype)</title>

<style>
:root{--bg1:#0d0a2e;--bg2:#241a5c;--panel:#14102b;--pan2:#211c3d;--lav:#cfcbea;--peri:#a9b4e6;--tx:#f3f1ff;--mu:#aaa6c7;--bad:#e9a3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}

h1{font-size:22px;margin:4px 0 12px;line-height:1.25}h2{font-size:17px;margin:20px 0 8px}p{margin:6px 0}

button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.pill{background:var(--pan2);border-radius:999px;padding:11px 18px;min-height:44px;color:var(--tx)}
.pill.on{background:var(--lav);color:#17123a;font-weight:700}

.bubble{background:var(--pan2);padding:10px 16px;border-radius:18px;margin-bottom:10px;max-width:260px;text-align:center;font-size:15px}
.dock{position:relative;padding:0 0 18px}

.quick{display:flex;gap:8px;margin:0 0 10px}.quick button{flex:1;background:rgba(20,16,43,.8);border-radius:18px;padding:10px 6px;font-size:13px;min-height:48px}

.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mu);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.25}}
.compose{display:flex;gap:8px;padding:10px 14px;background:#0b0824}.compose input{border-radius:999px}
.send{width:48px;height:48px;border-radius:50%;background:var(--lav);color:#17123a;font-size:20px;flex:none}
.modal{position:absolute;inset:0;background:rgba(5,3,20,.7);display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--panel);width:100%;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--lav);color:#17123a;padding:10px 18px;border-radius:999px;z-index:20;font-weight:700;white-space:nowrap}
.cgw{position:relative;margin:34px 24px 30px 24px}.cg{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;touch-action:none;cursor:crosshair;border:1px solid #3a3470;outline-offset:3px}.cg .q{position:absolute;width:50%;height:50%}.cg .ax1{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff40}.cg .ax2{position:absolute;top:50%;left:0;right:0;height:1px;background:#ffffff40}.cg .wl{position:absolute;transform:translate(-50%,-50%);font-size:12px;color:#ffffffb0;pointer-events:none;white-space:nowrap}.cg .dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:4px solid #7a6fe0;box-shadow:0 2px 10px #0008;pointer-events:none;display:none}.cga{position:absolute;font-size:12px;color:#aaa6c7;white-space:nowrap}.cgr{margin:10px 0 0;min-height:44px}.mood{display:flex;gap:6px}.mood button{flex:1;border-radius:18px;padding:12px 2px;min-height:48px;color:#17123a;font-weight:700;font-size:14px;opacity:.55}.mood button.on{opacity:1;outline:3px solid #fff}
.tag{display:inline-block;background:var(--pan2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mu)}
.scroll{overflow-x:auto}.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px}.chk input{width:22px;height:22px;margin-top:2px;flex:none}

.pv{display:block;width:100%;text-align:left;background:rgba(20,16,43,.78);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-size:14px;min-height:44px}
.talk{background:#17123a;color:#fff;border-radius:999px;min-height:54px;width:100%;font-weight:700;margin-bottom:12px}
.miss{border:1px dashed #4a4580;background:none;color:var(--mu)}
.toast{white-space:normal;max-width:90%;text-align:center}
.card textarea{min-height:0}

.tile{width:50px;flex:none;background:var(--pan2);border-radius:16px;text-align:center;padding:6px 0;line-height:1.1}.tile small{display:block;font-size:12px;color:var(--peri)}.tile b{font-size:21px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.dchip{flex:none;width:54px;min-height:68px;border-radius:18px;background:var(--pan2);padding:8px 0 4px;text-align:center;scroll-snap-align:center}.dchip small{display:block;font-size:11px;color:var(--mu)}.dchip b{font-size:19px}.dchip i{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:var(--peri)}
.dchip.on{background:var(--lav);color:#17123a}.dchip.on small{color:#3b3566}.dchip.on i{background:#17123a}
.tps{display:flex;align-items:center;gap:8px}.tps select{width:auto;flex:1;border-radius:999px;text-align:center;text-align-last:center;min-height:50px;font-size:19px;font-weight:700}
.tl{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #2c2650}.tl:last-child{border:0}.tm{width:74px;flex:none;color:var(--peri);font-weight:700;font-size:14px}.tl>span:nth-child(2){flex:1}

/* Visual language: serif headings, soft decor, rounded illustrated cards, floating tab bar. */
h1,h2,.ser{font-family:'Playfair Display',Georgia,serif}
h1{font-size:32px;font-weight:700;letter-spacing:-.3px}h2{font-size:22px;font-weight:600}
.chat-header h1{font-size:24px}
#app::before{content:"";position:absolute;left:0;top:0;right:0;height:330px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22390%22 height=%22330%22 viewBox=%220 0 390 330%22%3E%3Cpath d=%22M390 40C300 60 250 130 300 190S400 260 390 330V40z%22 fill=%22%237a6fe0%22 fill-opacity=%22.10%22/%3E%3Cpath d=%22M390 90C330 100 300 150 330 200S390 250 390 270V90z%22 fill=%22%237a6fe0%22 fill-opacity=%22.10%22/%3E%3Cpath d=%22M-10 0C60 10 90 60 40 110S-20 170 -10 200V0z%22 fill=%22%238fd0c9%22 fill-opacity=%22.06%22/%3E%3Cg fill=%22%23d9d4f7%22 fill-opacity=%22.7%22%3E%3Ccircle cx=%22330%22 cy=%2230%22 r=%221.5%22/%3E%3Ccircle cx=%22360%22 cy=%2270%22 r=%221.2%22/%3E%3Ccircle cx=%22300%22 cy=%2286%22 r=%221%22/%3E%3Ccircle cx=%22352%22 cy=%22120%22 r=%221.6%22/%3E%3C/g%3E%3C/svg%3E") no-repeat top center/100% auto;pointer-events:none;z-index:0}
main,.chat-header{position:relative;z-index:1}
.card{border-radius:28px;border:1px solid #2c2650;padding:18px}
nav{position:relative;z-index:2;margin:0 14px calc(14px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:28px;background:var(--panel);border:1px solid #2c2650;box-shadow:0 8px 24px #0008}

.acch b{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700}
.acc{border-radius:24px}
.ckd{border-radius:22px}
.hm .hero{border-radius:28px;background:linear-gradient(135deg,#2c2270,#1f1760)}
.hm .hero h2{font-size:25px;line-height:1.15}
.wd{border-radius:18px}.wd svg{display:block}
.wkc{background:linear-gradient(160deg,#17353f,#142b3a)!important;border-color:#2a4c58!important;position:relative;overflow:hidden}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chat-info-sheet .help-entry:last-child{border:0}
.chat-info-sheet .help-entry b{display:block;font-size:14px}
.chat-info-sheet .help-entry p{margin:3px 0}
.tour-block{position:absolute;inset:0;z-index:40}
.splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:linear-gradient(180deg,#2c2270 0%,#1f1760 45%,#150f45 100%);color:#f3f1ff;overflow:hidden}
.sp-bg{position:absolute;inset:0;width:100%;height:100%}

.sp-go{display:inline-flex;align-items:center;gap:10px;margin-top:24px;height:54px;padding:0 26px;border-radius:27px;border:0;background:#d9d4f7;color:#17123a;font:700 17px inherit;font-family:inherit;box-shadow:0 6px 18px #0006;cursor:pointer}

.sec{padding:16px 0 12px;border-top:1px solid #2c2650}

/* Daily check-in tab and simple Home */

.accb{padding:0 16px 16px}

.edot{flex:none;width:12px;height:12px;border-radius:50%}
