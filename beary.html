<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Beary – wellness companion (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0d0a2e;--bg2:#241a5c;--panel:#14102b;--pan2:#211c3d;--lav:#cfcbea;--peri:#a9b4e6;--tx:#f3f1ff;--mu:#aaa6c7;--bad:#e9a3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#07051c;color:var(--tx);font:16px/1.45 Figtree,system-ui,sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2) 80%);overflow:hidden}

h1{font-size:22px;margin:4px 0 12px;line-height:1.25}h2{font-size:17px;margin:20px 0 8px}p{margin:6px 0}
.mu{color:var(--mu);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.pill{background:var(--pan2);border-radius:999px;padding:11px 18px;min-height:44px;color:var(--tx)}
.pill.on{background:var(--lav);color:#17123a;font-weight:700}
.btn{background:var(--lav);color:#17123a;font-weight:700;border-radius:999px;padding:14px 22px;width:100%;min-height:48px}
.btn.ghost{background:var(--pan2);color:var(--tx);font-weight:500}
.btn.sm{width:auto;padding:10px 18px;min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--panel);border-radius:22px;padding:16px;margin:10px 0}

input,select,textarea{background:var(--pan2);border:1px solid #3a3466;border-radius:16px;padding:12px 14px;width:100%}
textarea{min-height:120px;resize:vertical}
label{display:block;margin:12px 0 6px;color:var(--mu);font-size:14px}
nav{display:flex;background:#0b0824;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);padding:8px 2px;min-height:52px;border-radius:16px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--tx);background:var(--pan2)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;z-index:2;margin-bottom:-34px;padding-top:12px}
.stage img{display:block;width:100%;max-width:285px;height:auto;min-height:0;max-height:100%;object-fit:contain}
.bubble{background:var(--pan2);padding:10px 16px;border-radius:18px;margin-bottom:10px;max-width:260px;text-align:center;font-size:15px}
.dock{position:relative;padding:0 0 18px}
.say{background:rgba(23,18,58,.55);border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 20px;width:100%;color:#fff;text-align:left;min-height:56px;justify-content:space-between}

.quick{display:flex;gap:8px;margin:0 0 10px}.quick button{flex:1;background:rgba(20,16,43,.8);border-radius:18px;padding:10px 6px;font-size:13px;min-height:48px}
.sky{display:flex;gap:10px;align-items:center;background:rgba(20,16,43,.55);padding:8px 14px;border-radius:999px;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.m{max-width:82%;padding:11px 15px;border-radius:18px;background:var(--panel);white-space:pre-wrap}

.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.25}}

.mood{display:flex;gap:6px}.mood button{flex:1;border-radius:18px;padding:12px 2px;min-height:48px;color:#17123a;font-weight:700;font-size:14px;opacity:.55}.mood button.on{opacity:1;outline:3px solid #fff}
.tag{display:inline-block;background:var(--pan2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mu)}
.scroll{overflow-x:auto}.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:44px}.chk input{width:22px;height:22px;margin-top:2px;flex:none}

.pv{display:block;width:100%;text-align:left;background:rgba(20,16,43,.78);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-size:14px;min-height:44px}
.talk{background:#17123a;color:#fff;border-radius:999px;min-height:54px;width:100%;font-weight:700;margin-bottom:12px}
.miss{border:1px dashed #4a4580;background:none;color:var(--mu)}
.toast{white-space:normal;max-width:90%;text-align:center}
.card textarea{min-height:0}

.tile{width:50px;flex:none;background:var(--pan2);border-radius:16px;text-align:center;padding:6px 0;line-height:1.1}.tile small{display:block;font-size:12px;color:var(--peri)}.tile b{font-size:21px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.dchip{flex:none;width:54px;min-height:68px;border-radius:18px;background:var(--pan2);padding:8px 0 4px;text-align:center;scroll-snap-align:center}.dchip small{display:block;font-size:11px;color:var(--mu)}.dchip b{font-size:19px}.dchip i{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:var(--peri)}
.dchip.on{background:var(--lav);color:#17123a}.dchip.on small{color:#3b3566}.dchip.on i{background:#17123a}
.tps{display:flex;align-items:center;gap:8px}.tps select{width:auto;flex:1;border-radius:999px;text-align:center;text-align-last:center;min-height:50px;font-size:19px;font-weight:700}
.tl{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #2c2650}.tl:last-child{border:0}.tm{width:74px;flex:none;color:var(--peri);font-weight:700;font-size:14px}.tl>span:nth-child(2){flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Chat screen: accessible circular controls and slide-out conversation history. */
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;flex:none}
.chat-header h1{flex:1;margin:0;font-size:22px}
.chat-icon{width:44px;height:44px;border-radius:50%;background:var(--pan2);color:var(--tx);display:grid;place-items:center;flex:none}
.chat-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.chat-help-icon{font-size:23px;font-weight:700;border:1px solid #514879}
.chat-help-icon:focus-visible,.chat-icon:focus-visible{outline:3px solid var(--peri)}
.chat-overlay{position:absolute;inset:0;background:rgba(5,3,20,.68);z-index:12}
.chat-drawer{position:absolute;left:0;top:0;bottom:0;width:58%;min-width:215px;max-width:285px;z-index:13;background:#171230;display:flex;flex-direction:column;padding:20px 12px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:12px 0 35px rgba(0,0,0,.25)}
.drawer-heading{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 3px 10px}
.drawer-heading h2{margin:0;font-size:19px}
.drawer-close{border-radius:50%;background:var(--pan2);width:36px;height:36px;font-size:23px;flex:none}
.drawer-new{border:1px solid #484167;border-radius:16px;background:var(--pan2);padding:12px 10px;text-align:left;width:100%;margin:8px 0 12px;min-height:44px;font-weight:700}
.drawer-history{flex:1;overflow-y:auto;min-height:0}
.drawer-history button{display:block;width:100%;text-align:left;border-radius:13px;background:transparent;color:var(--tx);padding:12px 10px;margin:2px 0;min-height:52px;overflow-wrap:anywhere}
.drawer-history button.active{background:#393154}
.drawer-history small{display:block;font-size:11px;color:var(--mu);margin-top:3px}
.chat-info-sheet h3{font-size:15px;margin:18px 0 7px;color:var(--peri)}
.chat-info-sheet p{font-size:14px;line-height:1.5}
.chat-info-sheet ul{margin:8px 0;padding-left:20px;font-size:14px;line-height:1.55}
.chat-info-sheet li{margin:6px 0}
.chat-info-sheet a{color:#cfd9ff;text-decoration:underline;text-underline-offset:3px}
.chat-info-sheet .info-warning{border:1px solid #59517d;background:#211c3d;border-radius:16px;padding:12px;margin:12px 0}
.chat-info-sheet .help-entry{border-bottom:1px solid #363050;padding:10px 0}
.chat-info-sheet .help-entry:last-child{border:0}
.chat-info-sheet .help-entry b{display:block;font-size:14px}
.chat-info-sheet .help-entry p{margin:3px 0}
</style></head><body><div id="app"></div>
<script>
// ===== Data layer (prototype only: localStorage. Replace with a secure backend; not production health-data storage) =====
const KEY='beary-proto-v1',$=s=>document.querySelector(s);
const iso=d=>d.toISOString().slice(0,10),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const MOODS=[['good','Good','#9fcf9f'],['okay','Okay','#b6a5cf'],['low','Low','#9fb4d3'],['irr','Irritable','#d3a0a0']];
const MN=Object.fromEntries(MOODS.map(m=>[m[0],m[1]]));
function seed(){const checks={},sleep={};const mo=['okay','low','low','okay','irr','low','okay'],hs=[7.5,6.5,6,7,5.5,6.5,7];
 mo.forEach((m,i)=>{const d=iso(ago(6-i));checks[d]={entries:[{t:'12:00',mood:m,note:i==4?'Busy day, felt on edge with school stuff.':'',sample:1}],meds:i==3?'skipped':'taken',msample:1};sleep[d]={h:hs[i],q:'ok',sample:1}});
 return{view:'home',v2:1,ms:{},checks,sleep,cur:0,
 conv:[{id:1,sample:1,t:ago(2).toISOString(),title:'Feeling overwhelmed',msgs:[{r:'u',t:'I feel overwhelmed with school and work lately.'},{r:'b',t:'That sounds like a lot to carry. What has felt heaviest this week?',proto:1},{r:'u',t:'Is it stress or is my mood changing? I can\'t tell them apart.'}]}],
 appts:[{id:1,sample:1,who:'Dr. Rivera (sample)',kind:'Therapy session',date:iso(ago(-4)),time:'15:30'}],sums:[],preps:{}}}
const blank=()=>({view:'home',v2:1,ms:{},checks:{},sleep:{},cur:0,conv:[{id:Date.now(),t:new Date().toISOString(),title:'New conversation',msgs:[]}],appts:[],sums:[],preps:{}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();Object.values(S.checks).forEach(c=>{if(!c.entries){c.entries=c.mood?[{t:'12:00',mood:c.mood,note:c.note||''}]:[];delete c.mood;delete c.note}});
if(!S.v2){const sd=seed();for(const d in sd.checks){const c=S.checks[d],e=c&&c.entries,x=sd.checks[d].entries[0];if(c&&e.length==1&&e[0].mood==x.mood&&e[0].t=='12:00'&&(e[0].note||'')==x.note){e[0].sample=1;c.msample=1}}
 for(const d in sd.sleep){const z=S.sleep[d];if(z&&z.h==sd.sleep[d].h&&z.q=='ok')z.sample=1}
 S.appts.forEach(a=>{if(a.id===1)a.sample=1});S.conv.forEach(c=>{if(c.id===1)c.sample=1});const m=S.ms={};const t=new Date().toISOString().slice(0,10);
 if(Object.values(S.checks).some(c=>c.entries.some(e=>!e.sample)))m.checkin=t;if(S.conv.some(c=>!c.sample&&c.msgs.some(x=>x.r=='u')))m.chat=t;if(Object.values(S.sleep).some(z=>!z.sample))m.sleep=t;
 if(S.sums.length)m.summary=t;if(S.appts.some(a=>!a.sample))m.appt=t;if(Object.keys(S.preps).length)m.prep=t;S.v2=1}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ui={stack:[],sum:{range:3,src:{chat:1,checks:1},ex:{}},draft:null,busy:false,err:null,modal:null,hist:false};
const closeHistory=()=>{ui.hist=false;render()};
const openChatInfo=()=>{ui.hist=false;ui.modal='chatInfo';render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.hist){closeHistory()}else if(e.key==='Escape'&&ui.modal==='chatInfo'){ui.modal=null;render()}});

// ===== Voiceflow adapter boundary =====
// Presentation never calls Voiceflow directly. To connect: deploy a small server proxy that holds your Voiceflow API key
// and calls POST https://general-runtime.voiceflow.com/state/user/{userID}/interact with your versionID;
// then set VOICEFLOW.proxyUrl to that proxy. Never put the API key in this file.
const VOICEFLOW={proxyUrl:null};
const CRISIS=/(suicid|kill myself|end my life|want to die|hurt myself|self.?harm|not safe)/i;
const ChatService={async send(text,history){
 if(VOICEFLOW.proxyUrl){const r=await fetch(VOICEFLOW.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});if(!r.ok)throw new Error('Service error');return{text:(await r.json()).text}}
 await new Promise(r=>setTimeout(r,900));if(/\/fail/.test(text))throw new Error('Simulated failure');
 if(CRISIS.test(text))return{crisis:true};
 if(/\b(am i bipolar|do i have bipolar|diagnose me|is this mania|am i manic|is this depression)\b/i.test(text))return{text:'I can explain terms and help you prepare for an evaluation, but I cannot determine whether you have bipolar disorder or identify a mood episode. A licensed clinician can review your experience and history with you. Would you like to write down questions for an appointment?',proto:1};
 if(/\b(hypomania|hypomanic)\b/i.test(text))return{text:'Hypomania is a period of elevated or unusually irritable mood and increased energy or activity that is less severe than mania. It is a clinical term, not something Beary can identify in an individual. Read more: https://medlineplus.gov/bipolardisorder.html',proto:1};
 if(/\b(mania|manic)\b/i.test(text))return{text:'Mania is a clinical term for a period of unusually elevated or irritable mood and increased activity or energy. A healthcare professional evaluates symptoms and their context. More information: https://www.nimh.nih.gov/health/publications/bipolar-disorder',proto:1};
 if(/\b(bipolar|bipolar disorder)\b/i.test(text))return{text:'Bipolar disorder is a mental health condition involving changes in mood, energy, activity, and thinking, including manic or hypomanic and depressive episodes. These terms describe patterns assessed by clinicians. Learn more: https://www.nimh.nih.gov/health/publications/bipolar-disorder',proto:1};
 if(/support group|support organization|where can i find support|find help|resources/i.test(text))return{text:'The Depression and Bipolar Support Alliance (DBSA) offers peer-support resources: https://www.dbsalliance.org/ . For mental health treatment providers in the U.S., use the government directory at https://findtreatment.gov/ . For immediate U.S. crisis support, call or text 988.',proto:1};
 if(/questions.*(doctor|provider|appointment)|what should i ask|prep.*appointment|prepare.*visit/i.test(text))return{text:'For your next visit, you could write down: What changes should I describe? Which mood, sleep, or energy patterns should I track? What questions do I have about care options or medications? You can edit these questions and bring them to your clinician.',proto:1};
 if(/(medic|meds|dose|pill)/i.test(text))return{text:'I can\'t advise on starting, stopping or changing medication. Your prescriber is the right person for that. Want me to add it to your appointment questions?',proto:1};
 if(/(haven't slept|not sleeping|racing|can't stop)/i.test(text))return{text:'Thanks for telling me. A big change like that is worth sharing with your care team soon. I can help you put it into a summary for them.',proto:1};
 const r=['Thank you for sharing that. What was that like for you?','I\'m listening. Is there anything about your sleep or energy you\'d want to remember for later?','That makes sense to put into words. Would you like to note it as a question for your next appointment?'];
 return{text:r[history.length%r.length],proto:1}}};

// ===== Journey, sample-data and summary helpers =====
const EN={low:'Low',steady:'Steady',high:'High'},QN={rested:'restful',ok:'okay',poor:'poor'};
const MS=[['checkin','First check-in','Add a mood entry',[25,70]],['chat','First conversation','Say hello to Beary',[70,35]],['sleep','Sleep noted','Log a night of sleep',[120,72]],['patterns','Looked back','Open My Patterns',[165,40]],['summary','First summary','Build a summary from your entries',[210,78]],['appt','Care team noted','Add an appointment',[255,38]],['prep','Visit prepared','Pick topics to discuss at a visit',[300,70]]];
const award=k=>{S.ms=S.ms||{};if(!S.ms[k]){S.ms[k]=today();ui.pend='A new star appeared in your sky';save()}};
function sky(big){const lit=MS.map(m=>!!(S.ms||{})[m[0]]),P=MS.map(m=>m[3]);
 const ln=P.slice(1).map((p,i)=>{const on=lit[i]&&lit[i+1];return `<line x1="${P[i][0]}" y1="${P[i][1]}" x2="${p[0]}" y2="${p[1]}" stroke="${on?'#9aa6e8':'#3d3870'}" stroke-width="1.2" ${on?'':'stroke-dasharray="3 4"'}/>`}).join('');
 const st=P.map((p,i)=>lit[i]?`<circle cx="${p[0]}" cy="${p[1]}" r="${big?13:10}" fill="#cfd6ff" opacity=".18"/><circle cx="${p[0]}" cy="${p[1]}" r="${big?5:4}" fill="#e8ebff"/>`:`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="none" stroke="#5a54a0"/>`).join('');
 return `<svg viewBox="0 0 330 110" width="100%" role="img" aria-label="Constellation with ${lit.filter(Boolean).length} of 7 stars found">${ln}${st}</svg>`}
const sampleCount=()=>{let n=0;Object.values(S.checks).forEach(c=>{n+=c.entries.filter(e=>e.sample).length;if(c.msample)n++});n+=Object.values(S.sleep).filter(z=>z.sample).length+S.appts.filter(a=>a.sample).length+S.conv.filter(c=>c.sample).length;return n};
const hasSample=()=>sampleCount()>0;
function removeSample(){if(!confirm('Remove the sample entries? Anything you added yourself stays.'))return;Object.keys(S.checks).forEach(d=>{const c=S.checks[d];c.entries=c.entries.filter(e=>!e.sample);if(c.msample){delete c.meds;delete c.msample}if(!c.entries.length&&c.meds===undefined)delete S.checks[d]});
 Object.keys(S.sleep).forEach(d=>{if(S.sleep[d].sample)delete S.sleep[d]});S.appts=S.appts.filter(a=>!a.sample);S.conv=S.conv.filter(c=>!c.sample);if(!S.conv.length)S.conv=blank().conv;S.cur=0;save();render();toast('Sample data removed. Your own entries are untouched.')}
function reloadSample(){const sd=seed();for(const d in sd.checks){if(!S.checks[d])S.checks[d]=sd.checks[d];else if(!S.checks[d].entries.length){S.checks[d].entries=sd.checks[d].entries}}for(const d in sd.sleep)if(!S.sleep[d])S.sleep[d]=sd.sleep[d];
 if(!S.appts.some(a=>a.id===1))S.appts.push(sd.appts[0]);if(!S.conv.some(c=>c.id===1))S.conv.push(sd.conv[0]);save();render();toast('Sample data added to empty days only.')}
function eraseAll(){if(!confirm('Erase everything saved in this browser, including your entries, summaries and stars? This can\'t be undone.'))return;try{localStorage.removeItem(KEY)}catch(e){}S=blank();ui.stack=[];ui.draft=null;save();render();toast('Everything erased')}
const TH=[['Sleep',/sleep|tired|rest|insomnia/i],['School & work',/school|work|class|job|deadline|exam/i],['Stress & overwhelm',/stress|overwhelm|anxious|pressure/i],['Energy & focus',/energy|motivat|focus|concentrat/i],['Mood changes',/mood|irritab|sad|low|angry|up and down/i],['Medication questions',/medic|meds|dose|pill/i],['People in my life',/friend|family|partner|roommate/i]];
const compose=d=>`${d.title}\n${d.range||''}\nSources: ${d.src}\nDraft built by simple rules from my own entries, not by AI. Edited by me.\n\n`+d.sec.map(x=>x.h.toUpperCase()+'\n'+x.t).join('\n\n');
function topicsFrom(m){if(!m.sec)return(m.qs||[]).map(t=>({t,s:'Question'}));const L=id=>{const x=m.sec.find(y=>y.id==id);return x?x.t.split('\n').map(z=>z.replace(/^- /,'').trim()).filter(Boolean):[]};

 <h2>Summary to draw from</h2>${S.sums.length?`<div class="row">${S.sums.map((m,i)=>`<button class="pill ${p.sum===i?'on':''}" aria-pressed="${p.sum===i}" onclick="pickSum(${id},${i})">${esc(m.title.replace('Summary, ',''))}</button>`).join('')}</div><p class="mu">Choosing one adds its themes and questions below. You decide what stays.</p>`:`<p class="mu">No saved summaries yet.</p><button class="btn ghost sm" onclick="go('sumsetup')">Build a summary</button>`}

 <h2>Your prep sheet</h2><div class="card"><p class="mu">${on.length} topic${on.length==1?'':'s'} to discuss${p.sum!=null&&S.sums[p.sum]?' · from '+esc(S.sums[p.sum].title):''}</p>${on.length?'<ul style="margin:6px 0;padding-left:20px">'+on.map(t=>'<li>'+esc(t.t)+'</li>').join('')+'</ul>':''}
 <div class="row"><button class="btn sm" onclick="ui.copyText=()=>prepText(${id});ui.modal='share';render()">Copy prep notes</button>${p.sum!=null&&S.sums[p.sum]?`<button class="btn ghost sm" onclick="ui.draft=S.sums[${p.sum}];go('sumview')">Open summary</button>`:''}</div></div><p class="mu">Nothing is sent to your provider. You choose what to share.</p></main>`},

};

// ===== Modals =====
function modal(){const m=ui.modal;if(!m)return'';let h='';
 if(m=='journey')h=`<h2>Your night sky</h2><p>A star lights up when you reflect, chat, make a summary or prepare for a visit. Stars never go out. Resting, skipping and coming back later are all part of the journey.</p><p class="mu">Stars show engagement, not mood or health.</p>`;
 if(m=='checkin'){const d=ui.d||today(),c=S.checks[d]||{entries:[]};if(!ui.f||ui.f.d!=d)ui.f={d,mood:null,energy:null,time:d==today()?nowT():'12:00',meds:c.meds,note:''};const f=ui.f;

  <label>Time</label>${tpick('f',f.time)}

  <p class="mu" id="fe" style="color:var(--bad)"></p><button class="btn" onclick="saveCheck()">Save</button>`}

  ${es.length?es.map(e=>`<div class="tl"><span class="tm">${ftm(e.t)}</span><span>${MN[e.mood]}${e.energy?' · energy '+EN[e.energy].toLowerCase():''}${e.sample?' <span class="tag">sample</span>':''}${e.note?`<br><span class="mu">“${esc(e.note)}”</span>`:''}</span></div>`).join(''):'<div class="card miss"><p>No mood entries. Nothing was recorded for this day, and that\'s okay.</p></div>'}
  <p><b>Medication:</b> ${c&&c.meds?(c.meds=='taken'?'logged taken':'logged not taken'):'<span class="mu">not logged</span>'}</p>
  <p><b>Sleep:</b> ${z?z.h+' hours, '+QN[z.q]+(z.sample?' <span class="tag">sample</span>':''):'<span class="mu">not recorded</span>'}</p>
  <div class="row"><button class="btn sm" onclick="ui.f=null;ui.modal='checkin';render()">${es.length?'Add or remove moods':'Add mood'}</button><button class="btn ghost sm" onclick="ui.modal='sleep';render()">${z?'Edit sleep':'Log sleep'}</button></div>`}
 if(m=='sleep'){const d=ui.d||today(),z=S.sleep[d];h=`<h2>${z?'Edit sleep':'Log sleep'}</h2><label>Night of (the morning you woke up)</label>${strip(d,'pickSleepDay')}<label for="sh">Hours slept</label><input id="sh" type="number" step="0.5" min="0" max="16" placeholder="e.g. 7.5" value="${z?z.h:''}"><label for="sq">How did it feel?</label><select id="sq">${Object.entries(QN).map(([k,v])=>`<option value="${k}" ${(z?z.q:'ok')==k?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><p id="fe" style="color:var(--bad)"></p><button class="btn" onclick="saveSleep()">Save</button>${z?'<button class="btn ghost" style="margin-top:8px" onclick="delSleep()">Remove this entry</button>':''}`}
 if(m=='appt'){if(!ui.ap||ui.ap.id!=ui.edit){const a=S.appts.find(x=>x.id==ui.edit)||{who:'',kind:'Therapy session',date:today(),time:'10:00'};ui.ap={id:ui.edit,who:a.who,kind:a.kind,date:a.date,time:a.time}}const a=ui.ap;
  h=`<h2>${ui.edit?'Edit':'Add'} appointment</h2><p class="mu">This only saves a note here. It doesn't book anything.</p><label for="aw">Provider name</label><input id="aw" value="${esc(a.who)}"><label for="ak">Type</label><input id="ak" value="${esc(a.kind)}"><label>Date</label>${strip(a.date,'pickApDay',1)}<label>Time</label>${tpick('ap',a.time)}<p id="fe" style="color:var(--bad)"></p><button class="btn" onclick="saveAppt()">Save</button>${ui.edit?'<button class="btn ghost" style="margin-top:8px" onclick="delAppt()">Delete</button>':''}`}
  if(m=='chatInfo')h=`<div class="chat-info-sheet"><h2 id="about-beary">About Beary <span aria-hidden="true">✦</span></h2>
  <p>Beary is a learning and reflection companion for people living with bipolar disorder, those exploring whether to seek an evaluation, and anyone who wants to understand the condition. It can help you explore information and prepare questions for a healthcare professional.</p>
  <h3>What Beary is designed to help with</h3>
  <ul><li>Learn about bipolar disorder from approved educational resources.</li><li>Understand mental health terminology in accessible language.</li><li>Find additional information and support organizations.</li><li>Prepare questions for healthcare providers.</li><li>Reflect on experiences and explore topics at your own pace.</li><li>Find crisis and emergency resources when appropriate.</li></ul>
  <h3>What Beary cannot do</h3>
  <ul><li>Diagnose bipolar disorder or any mental health condition.</li><li>Determine whether you are experiencing mania, depression, psychosis, or another mood state.</li><li>Recommend starting, stopping, or changing medication.</li><li>Interpret your symptoms as medical advice.</li><li>Replace a clinician or provide individualized treatment recommendations.</li></ul>
  <h3>Approved educational references</h3>
  <p>These are the sources designated for Beary's intended educational content:</p>
  <ul><li><a href="https://www.nimh.nih.gov/health/publications/bipolar-disorder" target="_blank" rel="noopener noreferrer">National Institute of Mental Health (NIMH)</a></li>
  <li><a href="https://medlineplus.gov/bipolardisorder.html" target="_blank" rel="noopener noreferrer">MedlinePlus (U.S. National Library of Medicine)</a></li>
  <li><a href="https://www.dbsalliance.org/" target="_blank" rel="noopener noreferrer">Depression and Bipolar Support Alliance (DBSA)</a></li>
  <li><a href="https://www.who.int/news-room/fact-sheets/detail/bipolar-disorder" target="_blank" rel="noopener noreferrer">World Health Organization (WHO)</a></li></ul>
  <div class="info-warning"><b>Prototype notice</b><p>Beary currently uses scripted demonstration replies. It does <b>not</b> look up, check, or cite these sources automatically yet. Educational answers will need source verification and clinical review before real-world use. Your conversations are saved in this browser, which is not secure storage for health data.</p></div>
  <h3>Help and crisis resources (United States)</h3>
  <p>These are real services, separate from Beary. Beary does not contact them for you.</p>
  <div class="help-entry"><b>988 Suicide &amp; Crisis Lifeline</b><p>Call or text <a href="tel:988">988</a> for mental health crisis support, 24/7. <a href="https://988lifeline.org/" target="_blank" rel="noopener noreferrer">988 Lifeline website</a></p></div>
  <div class="help-entry"><b>Emergency services</b><p>Call <a href="tel:911">911</a> if you or someone else is in immediate danger.</p></div>
  <div class="help-entry"><b>SAMHSA National Helpline</b><p>Call <a href="tel:18006624357">1-800-662-HELP (4357)</a> for free, confidential treatment referrals and information, 24/7. <a href="https://findtreatment.gov/" target="_blank" rel="noopener noreferrer">Find mental health treatment</a></p></div>
  <div class="help-entry"><b>Veterans Crisis Line</b><p>Call <a href="tel:988">988</a> and press 1, or text <a href="sms:838255">838255</a>. <a href="https://www.veteranscrisisline.net/" target="_blank" rel="noopener noreferrer">Veterans Crisis Line</a></p></div>
  <p class="mu">These phone numbers are for the U.S. For emergencies elsewhere, contact your local emergency service.</p></div>`;
 if(m=='share')h=`<h2>Before you copy</h2><p>This summary contains personal reflections. Copying doesn't send it anywhere. You decide who sees it.</p><div class="row"><button class="btn" onclick="copyIt()">Copy summary</button><button class="btn ghost" onclick="ui.modal=null;render()">Not now</button></div>`;
 return `<div class="modal" onclick="if(event.target==this){ui.modal=null;ui.f=null;ui.d=null;ui.ap=null;render()}"><div class="sheet" role="dialog" aria-modal="true">${h}<button class="btn ghost" style="margin-top:10px" onclick="ui.modal=null;ui.f=null;ui.d=null;ui.ap=null;render()">Close</button></div></div>`}

// ===== Actions =====
const err=m=>{const e=$('#fe');if(e)e.textContent=m};
function saveCheck(){syncF();const f=ui.f,ex=S.checks[f.d],cm=ex?ex.meds:undefined;if(!f.mood&&f.meds===cm)return err('Pick a mood, or change the medication log, to save.');if(f.mood&&!f.time)return err('Add a time for this entry.');const c=S.checks[f.d]||(S.checks[f.d]={entries:[]});if(f.mood){c.entries.push({t:f.time,mood:f.mood,energy:f.energy||undefined,note:(f.note||'').trim()});c.entries.sort((x,y)=>x.t.localeCompare(y.t));award('checkin')}if(f.meds!==undefined&&f.meds!==cm){c.meds=f.meds;delete c.msample}save();ui.modal=null;ui.f=null;ui.d=null;ui.ap=null;render();toast(f.mood?'Added. Moods can change, and that\'s okay.':'Saved')}
function delEntry(i){syncF();S.checks[ui.f.d].entries.splice(i,1);save();render()}
function saveSleep(){const h=parseFloat($('#sh').value),d=ui.d||today();if(isNaN(h)||h<0||h>16)return err('Enter hours between 0 and 16.');S.sleep[d]={h,q:$('#sq').value};award('sleep');save();ui.modal=null;ui.d=null;render();toast('Sleep saved for '+fd(d))}
function delSleep(){delete S.sleep[ui.d||today()];save();ui.modal=null;ui.d=null;render();toast('Sleep entry removed')}
function saveAppt(){apSync();const a=ui.ap,o={who:(a.who||'').trim(),kind:(a.kind||'').trim()||'Appointment',date:a.date,time:a.time};if(!o.who)return err('Add a provider name.');if(ui.edit)Object.assign(S.appts.find(x=>x.id==ui.edit),o);else S.appts.push({id:Date.now(),...o});award('appt');save();ui.modal=null;ui.ap=null;render();toast('Appointment saved for '+rel(o.date))}
function delAppt(){S.appts=S.appts.filter(a=>a.id!=ui.edit);save();ui.modal=null;ui.ap=null;render();toast('Removed')}
function newChat(){S.conv.unshift({id:Date.now(),t:new Date().toISOString(),title:'New conversation',excl:false,msgs:[]});S.cur=0;ui.hist=false;save();render()}
async function sendMsg(t){t=(t||'').trim();if(!t||ui.busy)return;const c=S.conv[S.cur];c.msgs.push({r:'u',t});if(c.title=='New conversation')c.title=t.slice(0,32);ui.err=null;save();await reply(c)}
async function reply(c){ui.busy=true;render();try{const r=await ChatService.send(c.msgs[c.msgs.length-1].t,c.msgs);c.msgs.push(r.crisis?{r:'b',crisis:1}:{r:'b',t:r.text,proto:r.proto});award('chat')}catch(e){ui.err=1}ui.busy=false;save();render()}
function retry(){ui.err=null;reply(S.conv[S.cur])}
function genSum(){const u=ui.sum,cut=iso(ago(u.range-1)),end=today(),sec=[],qt=[];
 const dts=[...Array(u.range)].map((_,i)=>iso(ago(u.range-1-i))),cs=u.src.chat?S.conv.filter(c=>c.t.slice(0,10)>=cut&&!u.ex[c.id]):[];
 cs.forEach(c=>c.msgs.filter(m=>m.r=='u').forEach(m=>qt.push({s:'Chat, '+fd(c.t),t:m.t})));
 if(u.src.checks)dts.forEach(d=>((S.checks[d]||{}).entries||[]).forEach(e=>e.note&&qt.push({s:'Check-in, '+fd(d)+' '+ftm(e.t),t:e.note})));
 const rec=u.src.checks?dts.filter(d=>(S.checks[d]||{}).entries&&S.checks[d].entries.length||S.sleep[d]):[];
 if(!qt.length&&!rec.length){toast('Nothing recorded in that range yet. Try a longer period or other sources.');return}
 const th=TH.map(([n,re])=>[n,qt.filter(q=>re.test(q.t)).length]).filter(x=>x[1]);
 sec.push({id:'themes',h:'Themes in what I wrote',k:'Keyword match, not AI',t:th.length?th.map(x=>`- ${x[0]} (${x[1]} ${x[1]==1?'entry':'entries'})`).join('\n'):'- No repeated topics found yet.'});
 sec.push({id:'words',h:'In my own words',k:'Your words, with dates',t:qt.length?qt.map(q=>`- “${q.t}” (${q.s})`).join('\n'):'- No written reflections in this period.'});
 if(u.src.checks){const L=[];let none=0;dts.forEach(d=>{const es=(S.checks[d]||{}).entries||[];if(!es.length){none++;return}L.push(`- ${fd(d)}: `+es.map(e=>`${MN[e.mood]} ${ftm(e.t)}${e.energy?' (energy '+EN[e.energy].toLowerCase()+')':''}`).join(' → '))});
  const sd=dts.filter(d=>S.sleep[d]);if(sd.length){const h=sd.map(d=>S.sleep[d].h);L.push(`- Sleep: ${sd.length} night(s) recorded, ${Math.min(...h)} to ${Math.max(...h)} hours, average ${(h.reduce((a,b)=>a+b)/h.length).toFixed(1)}`)}
  if(dts.length-sd.length)L.push(`- Sleep not recorded on ${dts.length-sd.length} night(s)`);const ml=dts.map(d=>(S.checks[d]||{}).meds);L.push(`- Medication log: taken on ${ml.filter(x=>x=='taken').length} day(s), not taken on ${ml.filter(x=>x=='skipped').length}, not logged on ${ml.filter(x=>!x).length}`);if(none)L.push(`- No mood entries on ${none} day(s)`);L.push('(Days without entries are simply not recorded. They are not results.)');
  sec.push({id:'track',h:'Recorded tracking',k:'Recorded entries',t:L.join('\n')})}
 sec.push({id:'qs',h:'Questions for my appointment',k:'From your messages. Add your own.',t:qt.filter(q=>q.t.includes('?')).map(q=>'- '+q.t).join('\n')||'- '});
 const src=[u.src.chat?cs.length+' conversation'+(cs.length==1?'':'s'):'',u.src.checks?'check-ins and sleep records':''].filter(Boolean).join(' and ')||'none';
 const title=`Summary, ${fd(cut)} to ${fd(end)}`;ui.draft={title,range:`${fd(cut)} to ${fd(end)} (${u.range==1?'today':'past '+u.range+' days'})`,src:src+(Object.values(u.ex).some(x=>x)?', some conversations left out':''),sec};award('summary');go('sumview')}
function saveSum(){if(!S.sums.includes(ui.draft)){ui.draft.saved=today();S.sums.unshift(ui.draft)}save();toast('Saved to My Care')}
async function copyIt(){const t=ui.copyText();try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}ui.modal=null;render();toast('Copied. Paste it where you choose.')}

function render(){const v=S.view;if(v=='patterns'&&ui.ptab!='sum')award('patterns');const pm=$('main'),pt=pm&&ui.lv==v?pm.scrollTop:0;ui.lv=v;const full=v=='home',tab={home:'home',chat:'chat',patterns:'patterns',care:'care',prep:'care',journey:'home'}[v]||(['sumsetup','sumview'].includes(v)?'patterns':v=='settings'?'home':'');
 const tabs=[['home','Home'],['chat','Chat'],['patterns','Patterns'],['care','Care']];
 $('#app').innerHTML=(v=='chat'?'<div style="flex:1;display:flex;flex-direction:column;min-height:0">':'')+V[v]()+(v=='chat'?'</div>':'')+`<nav aria-label="Main">${tabs.map(t=>`<button class="${tab==t[0]?'on':''}" ${tab==t[0]?'aria-current="page"':''} onclick="ui.stack=[];go('${t[0]}',false)"><svg viewBox="0 0 24 24">${ICON[t[0]=='patterns'?'pat':t[0]]}</svg>${t[1]}</button>`).join('')}</nav>`+modal();
 const dc=$('.dchip.on');if(dc&&dc.scrollIntoView)dc.scrollIntoView({inline:'center',block:'nearest'});const nm=$('main');if(nm)nm.scrollTop=pt;if(ui.pend){const q=ui.pend;ui.pend=null;toast(q)}if(v=='chat'){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;if(!ui.busy&&!ui.modal&&!ui.hist){const i=$('#ci');if(i&&matchMedia('(pointer:fine)').matches)i.focus()}}}
render();
